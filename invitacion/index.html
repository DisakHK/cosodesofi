<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ruedas Interactivas Centradas</title>
  <style>
    body {
  background: black;
  margin: 0;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

#container {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 1000px;
  height: 1000px;
  transform: translate(-50%, -50%);
  display: flex;
  justify-content: center;
  align-items: center;
}

.rueda {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(0deg);
  transform-origin: center center;
}

img {
  width: 100%;
  height: auto;
  display: block;
  pointer-events: none;
  user-select: none;
  outline: none;
}

#rueda-grande { width: 480px; }
#rueda-media { width: 500px; }
#rueda-pequena { width: 500px; }




  </style>
</head>
<body>
  <div id="container">
    <div id="rueda-grande" class="rueda"><img src="rueda grande.png"></div>
    <div id="rueda-media" class="rueda"><img src="rueda media.png"></div>
    <div id="rueda-pequena" class="rueda"><img src="rueda pequeña.png"></div>
  </div>

  <script>
  window.onload = () => {
    let activo = false;
    let inicioX = 0;
    let anguloGrande = 0, anguloMedia = 0, anguloPequena = 0;

    const ruedaGrande = document.getElementById("rueda-grande");
    const ruedaMedia = document.getElementById("rueda-media");
    const ruedaPequena = document.getElementById("rueda-pequena");

    document.addEventListener("mousedown", e => {
      activo = true;
      inicioX = e.clientX;
    });

    document.addEventListener("mouseup", () => activo = false);

    document.addEventListener("mousemove", e => {
      if (!activo) return;
      const delta = e.clientX - inicioX;
      inicioX = e.clientX;

      // Cada rueda rota a diferente velocidad y sentido
      anguloGrande += delta * 0.1;
      anguloMedia -= delta * 0.2;
      anguloPequena += delta * 0.3;

      actualizarRuedas();
    });

    function actualizarRuedas() {
      ruedaGrande.style.transform = `translate(-50%, -50%) rotate(${anguloGrande}deg)`;
      ruedaMedia.style.transform = `translate(-50%, -50%) rotate(${anguloMedia}deg)`;
      ruedaPequena.style.transform = `translate(-50%, -50%) rotate(${anguloPequena}deg)`;
    }

    // ✅ Centrar correctamente cuando ya cargaron todas las imágenes
    document.querySelectorAll(".rueda img").forEach(img => {
      if (!img.complete) {
        img.onload = () => actualizarRuedas();
      }
    });

    actualizarRuedas(); // primera llamada
  };
</script>

</body>
</html>
